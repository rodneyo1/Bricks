[package]
name = "bricks-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
bricks-control = { path = "../bricks-control" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }
serde_json.workspace = true
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true

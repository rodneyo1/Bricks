[package]
name = "bricks-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bricks-protocol.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = "1"
bricks-core.workspace = true
bricks-config.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }

[target.'cfg(windows)'.dependencies]
bricks-input-windows.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true


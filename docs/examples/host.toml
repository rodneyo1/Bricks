# Development configuration; recording-only QUIC probe supported, OS control pending.
schema_version = 1
role = "host"
profile = "gaming"

[transport]
backend = "quic"
listen = "127.0.0.1:47990"
max_datagram_bytes = 1200

[security]
identity_ref = "os-store:bricks-host"
require_paired_peer = true

[input.injection]
backend = "windows_send_input"

[recovery]
snapshot_interval_ms = 20
silence_timeout_ms = 250
send_history_capacity = 256
receive_buffer_capacity = 64
retry_min_ms = 2
retry_max_ms = 20
deadline_min_ms = 30
deadline_max_ms = 150

[diagnostics]
event_trace = false

[profiles.gaming.forwarding]
motion_aggregation_us = 0
